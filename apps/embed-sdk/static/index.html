<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner embed demo</title>
<style>
:root { --bg: #f4f4f5; --fg: #18181b; --muted: #71717a; --line: #e4e4e7; }
@media (prefers-color-scheme: dark) { :root { --bg: #18181b; --fg: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
main { max-width: 520px; margin: 0 auto; padding: 16px; }
.app-bar { font-weight: 700; padding: 12px 16px; border-bottom: 1px solid var(--line); }
form { display: grid; gap: 8px; margin: 12px 0 16px; }
label { display: grid; gap: 2px; font-size: 14px; }
input, select, button { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; }
#log { color: var(--muted); font-size: 12px; word-break: break-all; }
</style>
<script type="module" src="./js/embed-sdk/src/host.js"></script>
</head>
<body>
<div class="app-bar">Partner app (demo)</div>
<main>
<p>This page plays the partner's app. Its server exchanges the partner's own customer reference for a customer token, then shows the embed.</p>
<form id="partner">
<label>Partner <select name="partner"><option value="delivery_app">delivery_app (licensed agency: binds)</option><option value="ticketing_partner">ticketing_partner (referral only)</option></select></label>
<label>The partner's reference for its customer <input name="customer_ref" value="rider-0042" required></label>
<label>Language <select name="language"><option value="en">en</option><option value="zh-Hant">zh-Hant</option></select></label>
<button type="submit">Open the embed</button>
</form>
<div id="slot"></div>
<p id="log"></p>
</main>
</body>
</html>
