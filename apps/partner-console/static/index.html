<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner console</title>
<style>
:root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #0f766e; }
@media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #fafaf9; --muted: #a8a29e; --line: #44403c; --accent: #2dd4bf; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
#app { max-width: 900px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
h1 { font-size: 20px; margin: 0; } h2 { font-size: 16px; margin: 24px 0 6px; }
.muted { color: var(--muted); }
table { width: 100%; border-collapse: collapse; } td { padding: 8px 6px; border-top: 1px solid var(--line); }
tr.withheld td:nth-child(2) { color: var(--muted); font-style: italic; }
form { display: grid; gap: 10px; }
fieldset { border: 1px solid var(--line); border-radius: 10px; display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
label { display: grid; gap: 2px; }
input, select, button { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; min-width: 0; }
button { cursor: pointer; justify-self: start; border-color: var(--accent); }
pre { white-space: pre-wrap; word-break: break-all; background: rgba(127, 127, 127, 0.12); padding: 10px; border-radius: 8px; font-size: 12px; }
.flash { border-left: 4px solid var(--accent); padding: 6px 10px; }
</style>
<script type="module" src="./js/partner-console/src/main.js"></script>
</head>
<body><div id="app">…</div></body>
</html>
