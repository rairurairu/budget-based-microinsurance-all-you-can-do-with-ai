# The words the customer app and the partner embed show, in one offered language (ADR-011). Each
# offered language (insurer profile `languages.offered`) has a file with exactly these keys and
# the same {placeholders}; the API refuses to start otherwise. Illustrative copy: the insurer
# replaces it with approved wording. Money and dates are formatted by the app for the language.

app:
  title: Budget-Based Microinsurance
  tagline: You pick the price. We build the protection, every month.
  language: Language
  loading: Loading…
  demo_as: "Demo: act as"
  demo_note: Demo mode. Synthetic customers only; nothing here is real.
  close: Close
  save: Save
  saved: Saved.
  cancel: Cancel

