[package]
name = "microinsurance-api"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
microinsurance-engine.workspace = true
microinsurance-config.workspace = true
microinsurance-ai.workspace = true
microinsurance-ledger.workspace = true
microinsurance-learning = { workspace = true, features = ["schema"] }
microinsurance-store.workspace = true
microinsurance-triggers.workspace = true
microinsurance-workers.workspace = true
axum.workspace = true
tokio.workspace = true
chrono = { workspace = true, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
hmac = "0.12"
serde-saphyr.workspace = true
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# The load test (`examples/load_test.rs`) calls a running API over HTTP.
reqwest.workspace = true
