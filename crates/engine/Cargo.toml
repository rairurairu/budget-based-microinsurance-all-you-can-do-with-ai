[package]
name = "microinsurance-engine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
chrono.workspace = true
thiserror.workspace = true
# ADR-004: config text parser (pure Rust, no unsafe I/O) and, behind `schema`, contract schemas.
serde-saphyr.workspace = true
schemars = { workspace = true, optional = true }

[features]
# Derives JSON Schema for boundary types; enabled only by crates/contracts (`just gen`).
schema = ["dep:schemars"]

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "engine"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_arithmetic = "deny"
unwrap_used = "deny"
