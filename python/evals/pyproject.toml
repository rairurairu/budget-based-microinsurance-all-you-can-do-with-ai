[project]
name = "microinsurance-evals"
version = "0.0.0"
description = "Golden-set evaluations for the AI layer (offline)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microinsurance_evals"]
